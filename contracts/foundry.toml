[profile.default]
via_ir = true
# XorrDelegation keeps the active owner in transient storage (EIP-1153), which needs Cancun. X Layer runs the OP Stack
# on reth since 2025-10 and executes Cancun opcodes (verified by a spend on a fork, PLAN.md P3.1).
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
src = "src"
out = "out"
libs = ["lib"]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
