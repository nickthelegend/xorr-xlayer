[profile.default]
# The Aqua app packs a lot into one stack frame; via-IR is the sanctioned fix.
via_ir = true
optimizer = true
optimizer_runs = 200
src = "src"
out = "out"
libs = ["lib"]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
