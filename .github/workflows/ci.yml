# What can be checked on every push: the app and the executor without a chain, the contracts without a fork, and —
# because X Layer's public RPC needs no key — the contracts and the whole executor loop against a fork of X Layer
# mainnet. A proof that needs a secret would have to run on demand and skip otherwise; these need none, so they run
# every time and a red run means the product is broken, not that a secret was missing.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  XLAYER_RPC: https://rpc.xlayer.tech

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install
        run: |
          npm ci --ignore-scripts
          (cd server && npm ci --ignore-scripts)

      - name: Typecheck the app
        run: npx tsc --noEmit

      - name: Typecheck the executor
        run: npx tsc --noEmit -p server/tsconfig.json

      - name: Lint
        run: npm run lint

      # The client and the executor. `.live.test.ts` files are excluded — they need a running executor.
      - name: Unit tests
        run: npm test

      # The app bundled for iOS, as a phone loads it. Web never loads a `.native` file, so a dependency only the
      # native build imports can be missing while every step above passes (PLAN.md X78).
      - name: Bundle the app for iOS
        run: npx expo export --platform ios --output-dir "$RUNNER_TEMP/ios-export"

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1

      - name: Build
        run: forge build
        working-directory: contracts

      - name: Unit suites
        run: forge test --no-match-path 'test/*.fork.t.sol' -vv
        working-directory: contracts

      # Real X Layer state: wrapped TSLAx bought directly, NVDAx through USDG, the cap, a foreign venue, a close, a revoke.
      - name: Fork suite (X Layer mainnet)
        run: forge test --match-path 'test/XorrXLayer.fork.t.sol' -vv
        working-directory: contracts

  # The executor's own order path against a fork of X Layer: a fresh owner grants, the executor buys and sells through
  # Uniswap v3 into the owner's wallet, the on-chain cap refuses, revoke stops it (`npm run prove:fork`).
  fork-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: xorr
          POSTGRES_PASSWORD: xorr
          POSTGRES_DB: xorr_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U xorr" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://xorr:xorr@localhost:5432/xorr_ci
      XORR_CHAIN: xlayer-fork
      FORK_RPC: http://127.0.0.1:8545
      # The proof never calls Privy; the auth module needs these names to load.
      PRIVY_APP_ID: ci-unused
      PRIVY_APP_SECRET: ci-unused
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - uses: foundry-rs/foundry-toolchain@v1

      - name: Install
        run: |
          npm ci --ignore-scripts
          (cd server && npm ci --ignore-scripts)

      - name: Build contracts
        run: forge build
        working-directory: contracts

      - name: Fork X Layer
        run: |
          # X Layer's public RPC rate-limits shared runner IPs; a fork that stalls on its upstream left a deploy waiting on a
          # receipt until it timed out. Retry with backoff, throttle what anvil asks, and give each upstream call time.
          nohup anvil --fork-url "$XLAYER_RPC" --chain-id 196 --port 8545 --silent \
            --retries 10 --fork-retry-backoff 2000 --timeout 60000 --compute-units-per-second 200 > anvil.log 2>&1 &
          for i in $(seq 1 90); do
            cast chain-id --rpc-url "$FORK_RPC" >/dev/null 2>&1 && exit 0
            sleep 1
          done
          cat anvil.log
          echo "::error::the fork never answered"
          exit 1

      - name: Migrate
        run: npm run migrate
        working-directory: server

      # A deploy on a fork whose upstream is throttling can stall past its own ten-minute receipt wait (seen
      # 2026-09-19). The second attempt reads a warm cache and takes seconds, so one retry is the difference
      # between a red run about X Layer's rate limiter and a red run about this repo.
      - name: Bootstrap the fork (deploy delegation + anchor)
        run: npm run setup:fork || (echo "::warning::bootstrap timed out on the rate-limited fork; retrying once" && npm run setup:fork)
        working-directory: server

      - name: Prove the loop
        run: set -a && . ./.env.fork && set +a && npm run prove:fork
        working-directory: server
